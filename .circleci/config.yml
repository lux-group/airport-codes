version: 2.1

defaults: &defaults
  working_directory: ~/repo
  docker:
    - image: cimg/node:20.15.0

jobs:
  test:
    <<: *defaults
    steps:
      - checkout
      - run: yarn install
      - persist_to_workspace:
          root: ~/repo
          paths: .

  publish:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/repo
      - run:
          name: Publish package
          command: npm publish

workflows:
  test-publish:
    jobs:
      - test:
          context: LE
      - publish:
          context: LE
          requires:
            - test
          # filters:
          #   branches:
          #     only: master
